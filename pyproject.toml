# this_file: pyproject.toml
[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "clitw"
dynamic = ["version", "scripts"]
description = "Use MCP and OpenAPI services through named command-line tools or Python."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "filelock>=3.16", "httpx>=0.28,<1", "mcp>=2.3,<3", "mcp2cli==3.9.0",
  "distlib>=0.4,<1; sys_platform == 'win32'",
  "python-dotenv>=1,<2", "PyYAML>=6,<7", "platformdirs>=4,<6",
]

[project.urls]
Repository = "https://github.com/twardoch/clitw"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]
docs = ["properdocs==1.6.7", "mkdocs-materialx==10.2.3"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/clitw/__version__.py"

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clitw"]

[tool.hatch.build.targets.wheel.shared-data]
"skills" = "share/clitw/skills"

[tool.hatch.build.targets.sdist]
include = ["/src/clitw", "/skills", "/src_docs", "/tests", "/scripts", "/hatch_build.py", "/pyproject.toml", "/README.md", "/CHANGELOG.md", "/DEPENDENCIES.md", "/LICENSE"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" }, { file = "hatch_build.py" },
  { file = "src/clitw/openapi/catalogue.tsv" }, { file = "src/clitw/mcp/catalog.json" },
  { git = { commit = true, tags = true } },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
